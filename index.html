<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>iPhone Clock</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      /* 横置き時のタッチ操作による拡大等を防止 */
      touch-action: manipulation;
    }
    /* 年月日（時刻より小さく） */
    #date {
      font-size: 6vw;
      font-weight: 300;
      color: #aaa;
      margin-bottom: 2vh;
      letter-spacing: 0.05em;
    }
    /* 時刻（大きく表示） */
    #time {
      font-size: 19vw;
      font-weight: 600;
      line-height: 1;
      font-variant-numeric: tabular-nums; /* 数字の横幅を揃えてガタつきを防止 */
      letter-spacing: 0.02em;
    }
    /* 同期状態インジケータ */
    #status {
      position: absolute;
      bottom: 10px;
      right: 15px;
      font-size: 10px;
      color: #444;
    }
  </style>
</head>
<body>

  <div id="date">----年--月--日(--)</div>
  <div id="time">00:00:00</div>
  <div id="status">Syncing...</div>

  <script>
    let timeOffset = 0; // 端末時刻と正確な時刻の差分 (ms)

    // 正確な時刻APIから同期してオフセットを計算
    async function syncTime() {
      const statusEl = document.getElementById('status');
      try {
        const start = Date.now();
        // 無料の時刻取得API
        const response = await fetch('https://worldtimeapi.org/api/ip');
        const data = await response.json();
        const end = Date.now();
        
        // ネットワーク往復のレイテンシを考慮
        const latency = (end - start) / 2;
        const serverTime = new Date(data.datetime).getTime() + latency;
        
        // 端末時刻との差分を計算
        timeOffset = serverTime - Date.now();
        statusEl.textContent = 'NTP Synced';
        statusEl.style.color = '#00ff00';
      } catch (e) {
        console.error('時刻同期エラー:', e);
        statusEl.textContent = 'Sync Failed (Using Local Time)';
        statusEl.style.color = '#ff0000';
      }
    }

    // 表示の更新
    function updateClock() {
      // 端末時刻にオフセットを加算して正確な現在時刻を作成
      const now = new Date(Date.now() + timeOffset);

      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const date = String(now.getDate()).padStart(2, '0');
      const dayNames = ['日', '月', '火', '水', '木', '金', '土'];
      const day = dayNames[now.getDay()];

      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');

      document.getElementById('date').textContent = `${year}年${month}月${date}日 (${day})`;
      document.getElementById('time').textContent = `${hours}:${minutes}:${seconds}`;
    }

    // 初期化とタイマー設定
    syncTime();
    setInterval(updateClock, 1000);
    updateClock();

    // 3時間に1回再同期して時刻のズレを防止
    setInterval(syncTime, 3 * 60 * 60 * 1000);
  </script>
</body>
</html>
